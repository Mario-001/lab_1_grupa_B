<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Team Details</title>
    <style type="text/css">
        body {
            width: 800px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            color: #333;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            padding: 5px;
            margin: 5px 0;
            background-color: #f5f5f5;
            border-radius: 3px;
        }
    </style>
</head>
<body>
<!-- Dynamically display data -->
<header>
    <h1 th:text="'Team: ' + ${team.getName()}"></h1>
</header>
<section>
    <h2 th:text="'City: ' + ${team.getCity()}"></h2>
    <h2>Players in this team:</h2>
    <th:block>
        <ul>

            <li th:each="player: ${team.getPlayers()}"
                th:text=" ${player.getFirstName()} + '(#' + ${player.getJerseyNumber()} +
             ', ' + ${player.getPosition()} + ')'"></li>

        </ul>

    </th:block>

    <!-- Show "No players yet" if the team has no players -->

    <div th:if="${team.players.size() == 0}">
        <p>nema igraci ig</p>
    </div>

    <p>
        <a th:href="'/players?teamId=' + ${team.getId()}">Add another player</a> |
        <a href="/teams">Back to teams</a>
    </p>
</section>
</body>
</html>
