<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Add Player to Team</title>
    <style type="text/css">
        body {
            width: 800px;
            margin: auto;
            font-family: Arial, sans-serif;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        table, td, th {
            border: 1px solid black;
            padding: 10px;
        }
        section {
            float: left;
            margin: 0 1.5%;
            width: 63%;
        }
        aside {
            float: right;
            margin: 0 1.5%;
            width: 30%;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
<header>
    <h1>Select the Player to add to the Team</h1>
</header>
<!-- Display the errorMessage here (only if it exists), using the "error" class -->

<div th:if="${errorMessage != null}">
    <p th:text="${errorMessage}" class="error"></p>
</div>
<section>
    <h2>Select player:</h2>
    <form action="/teamDetails" method="POST">
        <!-- Hidden field with the selected teamId -->
        <input type="hidden" name="teamId" th:value="${selectedTeam.getId()}">
        <!-- Dynamically display radio buttons for each player,
             the value should be the playerId
             and the displayed text should be:
             <firstName> <lastName> (#<jerseyNumber>, <position>) -->

        <th:block th:each="player : ${players}">

            <input type="radio" name="playerId" th:id="'player_' + ${player.getPlayerId()}"
                   th:value="${player.getPlayerId()}">
            <label th:for="'player_' + ${player.getPlayerId()}"
                   th:text="${player.getFirstName()} + ' ' + ${player.getLastName()} +
                   ' ' + ${player.getJerseyNumber()}"></label>
                <br>
        </th:block>

        <br/>
        <input type="submit" value="Add player">
    </form>
</section>
<aside>
    <table>
        <tr>
            <td><b>Team ID</b></td>
            <th:block>
                <td><b th:text="${selectedTeam.getId()}"></b></td>
            </th:block>

        </tr>
        <tr>
            <td><b>Team Name</b></td>
            <th:block>
                <td><b th:text="${selectedTeam.getName()}"></b></td>
            </th:block>
        </tr>
        <tr>
            <td><b>City</b></td>
            <th:block>
                <td><b th:text="${selectedTeam.getCity()}"></b></td>
            </th:block>
        </tr>
    </table>
</aside>
</body>
</html>
